

# H2 en modo persistente (el archivo se guarda en disco, no en memoria)
spring.datasource.url=jdbc:h2:file:./data/eventifydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update: crea las tablas si no existen y actualiza sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
    springdoc.api-docs.path=/api-docs

# --- Thymeleaf (Spring Boot lo autoconfigura; estos son los defaults explícitos) ---
spring.thymeleaf.prefix=classpath:/template/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# cache=false durante desarrollo para ver cambios sin reiniciar
spring.thymeleaf.cache=false

# Excluye las rutas /admin/ de la documentación automática
springdoc.paths-to-exclude=/admin/**