<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lugares — Eventify Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <link rel="stylesheet" href="../../static/css/admin.css"/>

</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <span class="logo"> Eventify</span>
        <nav>
            <a th:href="@{/admin/events}">Eventos</a>
            <a th:href="@{/admin/venues}" class="active">Lugares</a>
            <a href="/swagger-ui.html" target="_blank" class="api-link">API Docs ↗</a>
        </nav>
    </div>
</header>

<main class="content">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="page-header">
        <h1>Catálogo de Lugares</h1>
        <a th:href="@{/admin/venues/new}" class="btn btn-primary">+ Nuevo Lugar</a>
    </div>

    <!-- ESCENARIO 2: catálogo vacío -->
    <div th:if="${#lists.isEmpty(venues)}" class="empty-state">
        <h2>No hay lugares registrados</h2>
        <p>Agrega el primer lugar haciendo clic en <strong>+ Nuevo Lugar</strong>.</p>
    </div>

    <!-- ESCENARIO 1: tabla con datos -->
    <table class="data-table" th:unless="${#lists.isEmpty(venues)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each itera sobre "venues" del Model -->
        <tr th:each="venue : ${venues}">
            <td th:text="${venue.id}">1</td>
            <td th:text="${venue.name}">Nombre del lugar</td>
            <td th:text="${venue.address}">Dirección</td>
            <td class="actions">
                <a th:href="@{/admin/venues/{id}/edit(id=${venue.id})}" class="btn btn-sm btn-warning">
                    Editar
                </a>
                <form th:action="@{/admin/venues/{id}/delete(id=${venue.id})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('¿Eliminar este lugar?')">
                    <button type="submit" class="btn btn-sm btn-danger"> Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer class="site-footer">
    <p>Eventify Admin Panel &copy; 2025 &mdash; <a href="/swagger-ui.html">Swagger UI</a></p>
</footer>

</body>
</html>
